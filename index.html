<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>invisible MAN</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@400;600&family=Cinzel:wght@700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
/* ── CUSTOM CURSOR ── */
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
body {
  cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><circle cx="16" cy="16" r="6.5" fill="none" stroke="%23c8a96a" stroke-width="1.4"/><line x1="16" y1="2" x2="16" y2="9" stroke="%23c8a96a" stroke-width="1.4" stroke-linecap="round"/><line x1="16" y1="23" x2="16" y2="30" stroke="%23c8a96a" stroke-width="1.4" stroke-linecap="round"/><line x1="2" y1="16" x2="9" y2="16" stroke="%23c8a96a" stroke-width="1.4" stroke-linecap="round"/><line x1="23" y1="16" x2="30" y2="16" stroke="%23c8a96a" stroke-width="1.4" stroke-linecap="round"/><circle cx="16" cy="16" r="1.6" fill="%23c8a96a"/></svg>') 16 16, crosshair;
  background:#191714;
  display:flex;flex-direction:column;align-items:center;
  font-family:'Crimson Text',Georgia,serif;
  -webkit-user-select:none;user-select:none;
  min-height:100vh;overflow-x:hidden;
}

/* ── INTRO ── */
#intro-screen{
  width:100%;min-height:100vh;background:#191714;
  display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;position:relative;overflow:hidden;
}

/* Bulb cluster */
#bulb-cluster{
  position:relative;width:100%;max-width:640px;
  height:200px;flex-shrink:0;
}
.bulb-wrap{
  position:absolute;top:0;
  display:flex;flex-direction:column;align-items:center;
}

/* Bulb glow animation */
@keyframes bulb-glow {
  0%,100% {
    filter:
      sepia(0.7) saturate(0.9) brightness(0.85) hue-rotate(5deg)
      drop-shadow(0 0 8px rgba(255,210,60,0.45))
      drop-shadow(0 0 22px rgba(255,160,20,0.35));
    opacity:0.88;
  }
  50% {
    filter:
      sepia(0.25) saturate(1.6) brightness(1.28) hue-rotate(3deg)
      drop-shadow(0 0 20px rgba(255,230,80,0.85))
      drop-shadow(0 0 55px rgba(255,175,25,0.7))
      drop-shadow(0 0 90px rgba(255,140,10,0.35));
    opacity:1;
  }
}
.bulb-img{
  display:block;
  animation: bulb-glow 2.6s ease-in-out infinite;
}

/* Title */
#title-block{
  text-align:center;
  opacity:0;
  transform:translateY(90px);
  flex-shrink:0;
  margin-top:10px;
  line-height:1;
  transition: opacity 1.2s ease, transform 1.3s cubic-bezier(0.16,1,0.3,1);
}
.title-invisible{
  font-family:'Century Gothic','Futura','Trebuchet MS',sans-serif;
  font-weight:700;
  font-size:5rem;letter-spacing:.15em;color:#c8a96a;
  text-transform:lowercase;display:block;margin-bottom:-.1em;
}
.title-man{
  font-family:'Bebas Neue','Impact','Arial Black',sans-serif;
  font-weight:400;font-size:12rem;color:#c8a96a;
  letter-spacing:.05em;text-transform:uppercase;line-height:.88;display:block;
}

#proceed-btn{
  position:absolute;bottom:28px;right:40px;cursor:inherit;opacity:0;
  border:none;background:none;padding:8px;line-height:0;transition:opacity 1s ease;
}
#proceed-btn svg{
  filter:drop-shadow(0 0 8px rgba(200,169,106,.9)) drop-shadow(0 0 22px rgba(160,130,70,.5));
  transition:filter .3s ease;
}
#proceed-btn:hover svg{
  filter:drop-shadow(0 0 14px rgba(220,185,100,1)) drop-shadow(0 0 36px rgba(190,155,70,.8));
}

/* ── GAME SCREEN ── */
#game-screen{display:none;width:100%;flex-direction:column;align-items:center;padding:2.2rem 1rem 3rem;background:#100804}
.hint{font-family:'Caveat',cursive;font-size:1.05rem;color:#855132;letter-spacing:.04em;margin-top:.2rem;text-align:center;font-weight:400}
#scr-locked,#scr-open{display:flex;flex-direction:column;align-items:center;width:100%;max-width:720px;gap:.6rem;transition:opacity .8s ease}
#scr-open{display:none;opacity:0;position:relative;}
#scr-open.vis{opacity:1}
#scr-locked.fade{opacity:0;pointer-events:none}
#key-svg{
  cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28"><path d="M6 14 Q6 6 14 6 Q22 6 22 14 Q22 19 18 21 L22 26 L18 26 L16 24 L14 26 L12 24 L10 26 L8 23 L13 21 Q10 19 10 14" fill="none" stroke="%23c8a96a" stroke-width="1.4"/><circle cx="13" cy="12" r="2.5" fill="none" stroke="%23c8a96a" stroke-width="1.2"/></svg>') 14 14, grab;
  display:block;transition:filter .2s;
}
#key-svg:hover{filter:drop-shadow(0 0 10px rgba(180,90,10,.7))}
.case-wrap{position:relative;width:100%;max-width:720px}
.case-wrap svg{display:block;width:100%}
.case-wrap.ready-to-burn{cursor:crosshair}
.case-wrap.ready-to-burn svg{animation:caseglow 1.2s ease-in-out infinite alternate;}
@keyframes caseglow{
  from{filter:drop-shadow(0 0 4px rgba(200,80,10,.4));}
  to{filter:drop-shadow(0 0 18px rgba(240,120,20,.8)) drop-shadow(0 0 40px rgba(200,60,5,.5));}
}
.interior{position:absolute;left:50%;transform:translateX(-50%);width:80%;top:28%;height:62%}

/* FIX: clean hover/glow — no outline, no box, use drop-shadow only */
.item-g{
  position:absolute;
  cursor:inherit;
  transition:filter .25s, transform .2s;
  outline:none;
  border:none;
  background:none;
  isolation:isolate;
}
.item-g img, .item-g svg {
  display:block;
}
.item-g:hover{
  filter:drop-shadow(0 0 8px rgba(200,80,15,.85));
  transform-origin:center center;
}
.item-g.picked{
  filter:drop-shadow(0 0 14px rgba(220,100,10,1));
}

#panel{width:100%;max-width:700px;border-top:1px solid #2a0e06;border-bottom:1px solid #2a0e06;border-right:1px solid #1a0804;border-left:3px solid #8a1808;padding:1rem 1.4rem;background:#0c0402;opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s;min-height:76px;pointer-events:none}
#panel.vis{opacity:1;transform:translateY(0);pointer-events:auto}

/* CHANGED: item title font → Century Gothic (same as 'invisible'), lowercase */
#ptitle{
  font-family:'Century Gothic','Futura','Trebuchet MS',sans-serif;
  font-size:1.05rem;font-weight:700;color:#c8a050;
  margin-bottom:.45rem;padding-bottom:.4rem;
  border-bottom:1px solid #1e0804;
  letter-spacing:.12em;text-transform:capitalize;
}

/* CHANGED: description font → Caveat */
#pdesc{
  font-family:'Caveat',cursive;
  font-size:1.18rem;line-height:1.75;color:#9a7048;
}

#backbtn{background:none;border:1px solid #3a1208;color:#6a2a10;font-family:'Caveat',cursive;font-size:1rem;letter-spacing:.04em;padding:.5rem 1.5rem;cursor:inherit;transition:all .22s;margin-top:.3rem}
#backbtn:hover{background:#150602;border-color:#8a2010;color:#c04020}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.shake{animation:shake .42s ease}
@keyframes keyTurn{0%{transform:translate(0,0) rotate(0deg)}30%{transform:translate(0,0) rotate(0deg)}60%{transform:translate(0,0) rotate(85deg)}80%{transform:translate(0,0) rotate(90deg) scale(.9)}100%{transform:translate(0,0) rotate(90deg) scale(.5);opacity:0}}
.key-unlock{animation:keyTurn .9s ease forwards}
@keyframes latchPop{0%{transform:rotate(0deg) translateY(0)}40%{transform:rotate(-15deg) translateY(-3px)}100%{transform:rotate(-35deg) translateY(-8px);opacity:.5}}
.latch-pop{animation:latchPop .7s .3s ease forwards}

/* ── MATCHBOX & MATCH ── */
#matchbox-el{
  position:absolute;
  left:-10%;
  top:60%;
  cursor:inherit;
  z-index:10;
  transform:rotate(6deg);
  opacity:0;
  transition:filter .2s, transform .2s, opacity .4s;
  animation:mbpulse 2.2s ease-in-out infinite;
  isolation:isolate;
}
@keyframes mbpulse{
  0%,100%{filter:drop-shadow(0 0 2px rgba(200,70,20,.25));}
  50%{filter:drop-shadow(0 0 9px rgba(230,100,20,.65));}
}
#matchbox-el:hover{
  animation:none;
  filter:drop-shadow(0 0 12px rgba(240,110,20,.9));
  transform:rotate(6deg) scale(1.08);
}
#matchbox-el.used{animation:none;pointer-events:none;}

#match-el{
  position:absolute;
  left:-1%;
  top:36%;
  cursor:inherit;
  z-index:12;
  display:none;
  transform-origin:bottom center;
  transition:filter .25s;
  isolation:isolate;
}
#match-el:hover{filter:drop-shadow(0 0 6px rgba(220,140,30,.7));}
#match-el.lit{
  cursor:default;
  filter:drop-shadow(0 0 10px rgba(255,160,30,1)) drop-shadow(0 0 28px rgba(220,100,10,.8));
  animation:matchflicker .15s ease-in-out infinite alternate;
}
@keyframes matchflicker{
  from{filter:drop-shadow(0 0 8px rgba(255,150,20,.9)) drop-shadow(0 0 22px rgba(200,80,5,.6));}
  to{filter:drop-shadow(0 0 14px rgba(255,180,40,1)) drop-shadow(0 0 38px rgba(230,100,10,.8));}
}
@keyframes strikeAnim{
  0%{transform:rotate(0deg) translateX(0);}
  25%{transform:rotate(-20deg) translateX(-14px);}
  55%{transform:rotate(25deg) translateX(18px);}
  80%{transform:rotate(-8deg) translateX(-4px);}
  100%{transform:rotate(0deg) translateX(0);}
}
#match-el.striking{animation:strikeAnim .35s ease forwards;}

/* Case ignite prompt */
#case-prompt{
  font-family:'Caveat',cursive;font-size:1rem;color:#7a3010;
  letter-spacing:.05em;text-align:center;
  margin-top:.4rem;opacity:0;transition:opacity .9s ease;pointer-events:none;
  animation:promptpulse 2s ease-in-out infinite;
  animation-play-state:paused;
}
#case-prompt.vis{opacity:1;animation-play-state:running;}
@keyframes promptpulse{
  0%,100%{color:#7a3010;}
  50%{color:#c84020;}
}

/* ── FIRE LAYER ── */
#fire-layer{
  position:fixed;inset:0;
  pointer-events:none;z-index:100;
  display:none;
  background:transparent;
}
@keyframes flick{
  from{transform:scaleX(var(--sx1,.9)) scaleY(.92) rotate(var(--ra,-4deg));}
  to{transform:scaleX(var(--sx2,1.1)) scaleY(1.18) rotate(var(--rb,4deg));}
}
@keyframes smokeRise{
  0%{transform:translateY(0) translateX(0) scale(1);opacity:.4;}
  100%{transform:translateY(-220px) translateX(var(--sdx,30px)) scale(3);opacity:0;}
}
@keyframes sparkFly{
  0%{transform:translateY(0) translateX(0) scale(1);opacity:1;}
  100%{transform:translateY(var(--spy,-120px)) translateX(var(--spx,40px)) scale(.3);opacity:0;}
}

/* ── CHAR OVERLAY ── */
#char-overlay{
  position:fixed;inset:0;background:#000;
  z-index:150;opacity:0;pointer-events:none;
  transition:opacity 2.5s ease;
}

/* ── FINAL SCREEN ── */
#final-screen{
  position:fixed;inset:0;background:#000;
  z-index:200;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:1.5rem;
  opacity:0;pointer-events:none;
  transition:opacity 3s ease;
}
#final-quote{
  font-family:'Crimson Text',serif;font-style:italic;
  font-size:1.55rem;color:#c8a96a;text-align:center;
  max-width:560px;padding:2rem;line-height:2;
  letter-spacing:.025em;opacity:0;transition:opacity 2.5s ease;
  min-height:3em;
}
#cursor-blink{
  display:inline-block;width:1.5px;height:1.1em;
  background:#c8a96a;margin-left:2px;vertical-align:middle;
  animation:blink .7s step-end infinite;
}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}
@keyframes quoteglow{
  0%,100%{text-shadow:0 0 18px rgba(200,169,106,.2),0 0 2px rgba(200,169,106,.4);}
  50%{text-shadow:0 0 40px rgba(200,169,106,.65),0 0 80px rgba(200,169,106,.28),0 0 4px rgba(200,169,106,.8);}
}
#final-ember{
  width:6px;height:6px;border-radius:50%;
  background:#c8a030;opacity:0;
  box-shadow:0 0 12px 4px rgba(200,160,48,.6);
  animation:emberpulse 2.5s ease-in-out infinite;
  animation-play-state:paused;
}
@keyframes emberpulse{
  0%,100%{transform:scale(1);opacity:.5;}
  50%{transform:scale(1.8);opacity:1;}
}

/* ── FILM GRAIN ── */
#grain-overlay {
  position: fixed;
  inset: 0;
  z-index: 350;
  pointer-events: none;
  background-image: url('data:image/svg+xml,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" stitchTiles="stitch"/></filter><rect width="200" height="200" filter="url(%23n)" opacity="1"/></svg>');
  background-repeat: repeat;
  background-size: 200px 200px;
  opacity: 0.055;
  mix-blend-mode: screen;
  animation: grainShift 0.1s steps(1) infinite;
}
@keyframes grainShift {
  0%   { background-position: 0px 0px; }
  11%  { background-position: -22px -18px; }
  22%  { background-position: 14px 7px; }
  33%  { background-position: -6px -28px; }
  44%  { background-position: 18px 22px; }
  55%  { background-position: -30px 11px; }
  66%  { background-position: 8px -15px; }
  77%  { background-position: -16px 26px; }
  88%  { background-position: 26px -8px; }
  100% { background-position: 0px 0px; }
}

#vignette-overlay {
  position: fixed;
  inset: 0;
  z-index: 345;
  pointer-events: none;
  background: radial-gradient(ellipse at 50% 46%, transparent 42%, rgba(4,2,1,0.72) 100%);
}

#warmcast-overlay {
  position: fixed;
  inset: 0;
  z-index: 340;
  pointer-events: none;
  background: rgba(110, 65, 15, 0.032);
  background-image:
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 3px,
      rgba(0,0,0,0.018) 3px,
      rgba(0,0,0,0.018) 4px
    ),
    linear-gradient(rgba(110,65,15,0.032), rgba(110,65,15,0.032));
}
</style>
</head>

/* ─────────────────────────────────────────────
   BUILD INTERIOR ITEMS
───────────────────────────────────────────── */
const interior=document.getElementById('interior');
let active=null;

ITEMS.forEach((item)=>{
 const div=document.createElement('div');
 div.className='item-g';
 div.style.cssText=`left:${item.left};top:${item.top};transform:rotate(${item.rot}deg);opacity:0;`;
 div.dataset.rot=item.rot;
 div.innerHTML=item.svg;
 div.addEventListener('click',()=>{
   if(active){active.classList.remove('picked');active.style.transform=`rotate(${active.dataset.rot}deg)`;}
   active=div;div.classList.add('picked');
   const pan=document.getElementById('panel');
   document.getElementById('ptitle').textContent=item.name;
   document.getElementById('pdesc').textContent=item.quote;
   pan.classList.remove('vis');
   requestAnimationFrame(()=>requestAnimationFrame(()=>pan.classList.add('vis')));
 });
 interior.appendChild(div);
});

function revealItems(){
 interior.querySelectorAll('.item-g').forEach((el,i)=>{
   el.style.transition='opacity .55s ease';
   setTimeout(()=>{ el.style.opacity='1'; }, i*140+250);
 });
 const mb=document.getElementById('matchbox-el');
 mb.style.transition='opacity .6s ease';
 setTimeout(()=>{ mb.style.opacity='1'; }, ITEMS.length*140+400);
}

/* ─────────────────────────────────────────────
   KEY DRAG
───────────────────────────────────────────── */
const keyEl=document.getElementById('key-svg');
const holeEl=document.getElementById('khole');
let drag=false,ox=0,oy=0,origPos=null;

function startDrag(cx,cy){
 drag=true;
 const r=keyEl.getBoundingClientRect();
 if(!origPos)origPos={left:r.left,top:r.top};
 ox=cx-r.left;oy=cy-r.top;
 keyEl.style.opacity='0';
 keyEl.style.position='fixed';
 keyEl.style.zIndex='999';
 keyEl.style.transition='none';
 keyEl.style.cursor='grabbing';
 keyEl.style.left=r.left+'px';
 keyEl.style.top=r.top+'px';
 requestAnimationFrame(()=>{ keyEl.style.opacity='1'; });
}
function moveDrag(cx,cy){if(!drag)return;keyEl.style.left=(cx-ox)+'px';keyEl.style.top=(cy-oy)+'px';}
function endDrag(cx,cy){
 if(!drag)return;drag=false;keyEl.style.cursor='grab';
 const kr=keyEl.getBoundingClientRect();
 const hr=holeEl.getBoundingClientRect();
 const dist=Math.hypot((kr.left+kr.width/2)-(hr.left+hr.width/2),(kr.top+kr.height/2)-(hr.top+hr.height/2));
 if(dist<82){
   keyEl.style.transition='left .2s ease,top .2s ease';
   keyEl.style.left=(hr.left+hr.width/2-kr.width/2)+'px';
   keyEl.style.top=(hr.top+hr.height/2-kr.height/2)+'px';
   setTimeout(()=>{
     keyEl.style.transformOrigin='22% 50%';
     keyEl.style.transition='none';
     keyEl.classList.add('key-unlock');
     document.getElementById('latch-g').classList.add('latch-pop');
     setTimeout(openBriefcase,1050);
   },220);
 } else {
   keyEl.style.transition='left .55s cubic-bezier(.175,.885,.32,1.275),top .55s cubic-bezier(.175,.885,.32,1.275)';
   keyEl.style.left=origPos.left+'px';keyEl.style.top=origPos.top+'px';
   const bc=document.getElementById('bc-svg');
   bc.classList.add('shake');bc.addEventListener('animationend',()=>bc.classList.remove('shake'),{once:true});
 }
}

keyEl.addEventListener('mousedown',e=>{startDrag(e.clientX,e.clientY);e.preventDefault();});
document.addEventListener('mousemove',e=>moveDrag(e.clientX,e.clientY));
document.addEventListener('mouseup',e=>endDrag(e.clientX,e.clientY));
keyEl.addEventListener('touchstart',e=>{startDrag(e.touches[0].clientX,e.touches[0].clientY);e.preventDefault();},{passive:false});
document.addEventListener('touchmove',e=>{if(drag){moveDrag(e.touches[0].clientX,e.touches[0].clientY);e.preventDefault();}},{passive:false});
document.addEventListener('touchend',e=>endDrag(e.changedTouches[0].clientX,e.changedTouches[0].clientY));

function openBriefcase(){
 document.getElementById('scr-locked').classList.add('fade');
 setTimeout(()=>{
   document.getElementById('scr-locked').style.display='none';
   const op=document.getElementById('scr-open');
   op.style.display='flex';
   requestAnimationFrame(()=>requestAnimationFrame(()=>{op.classList.add('vis');revealItems();}));
 },700);
}

document.getElementById('backbtn').addEventListener('click',()=>{
 if(fireBurning)return;
 const op=document.getElementById('scr-open');
 op.classList.remove('vis');
 setTimeout(()=>{
   op.style.display='none';
   const lk=document.getElementById('scr-locked');
   lk.style.display='flex';lk.classList.remove('fade');lk.style.opacity='1';
   keyEl.classList.remove('key-unlock');
   keyEl.style.cssText='cursor:grab;display:block;';
   document.getElementById('latch-g').classList.remove('latch-pop');
   origPos=null;
   setTimeout(()=>{const r=keyEl.getBoundingClientRect();origPos={left:r.left,top:r.top};},100);
   document.getElementById('panel').classList.remove('vis');
   if(active){active.classList.remove('picked');active.style.transform=`rotate(${active.dataset.rot}deg)`;active=null;}
   interior.querySelectorAll('.item-g').forEach(el=>el.style.opacity='0');
   matchState='box';
   matchLit=false;
   document.getElementById('matchbox-el').classList.remove('used');
   document.getElementById('matchbox-el').style.opacity='0';
   document.getElementById('match-el').style.display='none';
   document.getElementById('match-el').classList.remove('lit','striking');
   document.getElementById('match-flame-g').style.opacity='0';
   document.getElementById('case-prompt').classList.remove('vis');
   document.getElementById('case-prompt').textContent='';
   document.querySelector('.case-wrap').classList.remove('ready-to-burn');
 },650);
});

/* ─────────────────────────────────────────────
   MATCH / FIRE INTERACTION
───────────────────────────────────────────── */
let matchState = 'box';
let matchLit = false;
let fireBurning = false;

const matchboxEl = document.getElementById('matchbox-el');
const matchEl    = document.getElementById('match-el');
const casePrompt = document.getElementById('case-prompt');
const flameG     = document.getElementById('match-flame-g');

matchboxEl.addEventListener('click', () => {
  if (matchState !== 'box' || fireBurning) return;
  matchState = 'unlit';
  matchboxEl.classList.add('used');
  matchEl.style.display = 'block';
  matchEl.style.opacity = '0';
  matchEl.style.transform = 'translateY(30px) rotate(-8deg)';
  requestAnimationFrame(() => {
    matchEl.style.transition = 'opacity .5s ease, transform .5s cubic-bezier(.22,1.4,.36,1)';
    matchEl.style.opacity = '1';
    matchEl.style.transform = 'translateY(0) rotate(-8deg)';
  });
  casePrompt.textContent = 'strike the match';
  casePrompt.classList.add('vis');
});

matchEl.addEventListener('click', () => {
  if (fireBurning) return;
  if (matchState === 'unlit') {
    matchState = 'lit';
    matchLit = true;
    matchEl.style.transition = 'none';
    matchEl.classList.add('striking');
    setTimeout(() => {
      matchEl.classList.remove('striking');
      matchEl.classList.add('lit');
      flameG.style.opacity = '1';
      casePrompt.textContent = 'touch the case to set it ablaze';
      document.getElementById('case-wrap-el').classList.add('ready-to-burn');
    }, 360);
  }
});

document.getElementById('case-wrap-el').addEventListener('click', () => {
  if (!matchLit || fireBurning) return;
  fireBurning = true;
  matchLit = false;
  startFire();
});

/* ─────────────────────────────────────────────
   FIRE SEQUENCE
───────────────────────────────────────────── */
function startFire() {
  casePrompt.classList.remove('vis');
  matchEl.style.transition = 'opacity .3s ease';
  matchEl.style.opacity = '0';
  setTimeout(() => { matchEl.style.display = 'none'; }, 300);
  document.getElementById('case-wrap-el').classList.remove('ready-to-burn');
  document.getElementById('case-wrap-el').style.cursor = 'default';
  document.getElementById('panel').style.transition = 'opacity 1.5s ease';
  document.getElementById('panel').style.opacity = '0';
  document.getElementById('backbtn').style.transition = 'opacity 1.5s ease';
  document.getElementById('backbtn').style.opacity = '0';

  const caseWrap = document.getElementById('case-wrap-el');
  const rect = caseWrap.getBoundingClientRect();
  const fireLayer = document.getElementById('fire-layer');
  fireLayer.style.display = 'block';

  spawnFlames(rect, fireLayer);
  spawnSparks(rect, fireLayer);

  setTimeout(() => {
    caseWrap.style.transition = 'filter 3.5s ease';
    caseWrap.style.filter = 'sepia(1) saturate(0) brightness(0.06) contrast(4)';
  }, 700);

  setTimeout(() => spawnSmoke(rect, fireLayer), 1400);

  setTimeout(() => {
    document.getElementById('char-overlay').style.opacity = '1';
  }, 3200);

  setTimeout(() => {
    const finalScreen = document.getElementById('final-screen');
    finalScreen.style.opacity = '1';
    finalScreen.style.pointerEvents = 'auto';
  }, 5200);

  setTimeout(() => {
    const ember = document.getElementById('final-ember');
    ember.style.opacity = '1';
    ember.style.animationPlayState = 'running';
  }, 6000);

  setTimeout(() => {
    const quoteEl = document.getElementById('final-quote');
    quoteEl.style.opacity = '1';
    typeQuote(quoteEl, 'Who knows but that, on the lower frequencies, I speak for you?', 0);
  }, 6800);
}

function makeFlame(layer, x, y, w, h, color, blur, delay, rotA, rotB) {
  const f = document.createElement('div');
  const dur = (0.2 + Math.random() * 0.3).toFixed(3);
  const sxA = (0.82 + Math.random() * 0.1).toFixed(2);
  const sxB = (1.05 + Math.random() * 0.12).toFixed(2);
  f.style.cssText = `
    position:fixed;left:${x - w / 2}px;top:${y - h}px;
    width:${w}px;height:${h}px;
    border-radius:50% 50% 25% 25% / 65% 65% 35% 35%;
    background:linear-gradient(to top,${color},transparent);
    transform-origin:bottom center;
    --ra:${rotA}deg;--rb:${rotB}deg;--sx1:${sxA};--sx2:${sxB};
    animation:flick ${dur}s ease-in-out ${delay.toFixed(3)}s infinite alternate;
    filter:blur(${blur}px);mix-blend-mode:screen;
    opacity:0;pointer-events:none;z-index:101;transition:opacity 0.35s ease;
  `;
  layer.appendChild(f);
  setTimeout(() => { f.style.opacity = '0.92'; }, delay * 1000 + 80);
  return f;
}

function spawnFlames(rect, layer) {
  const bx = rect.left, by = rect.top, bw = rect.width, bh = rect.height;
  const count = 28;
  for (let i = 0; i < count; i++) {
    const t   = i / count;
    const px  = bx + t * bw + (Math.random() - 0.5) * (bw / count) * 2.5;
    const py  = by + bh;
    const delay = t * 0.9 + Math.random() * 0.35;
    const rot   = (Math.random() - 0.5) * 28;
    makeFlame(layer, px, py, 55 + Math.random() * 40, 110 + Math.random() * 90, '#a01006', 10, delay, rot - 6, rot + 6);
    makeFlame(layer, px + (Math.random()-0.5)*10, py, 34 + Math.random() * 25, 75 + Math.random() * 65, '#e04818', 5, delay + 0.05, rot * 0.75, -rot * 0.75);
    makeFlame(layer, px + (Math.random()-0.5)*6, py, 18 + Math.random() * 16, 45 + Math.random() * 45, '#f0a020', 2, delay + 0.1, rot * 0.5, -rot * 0.5);
    makeFlame(layer, px, py, 9 + Math.random() * 8, 22 + Math.random() * 22, '#fff0b0', 1, delay + 0.14, rot * 0.25, -rot * 0.25);
  }
  for (let j = 0; j < 6; j++) {
    const px  = bx + bw * (0.3 + Math.random() * 0.4);
    const py  = by + bh;
    const delay = 0.4 + Math.random() * 0.5;
    makeFlame(layer, px, py, 70 + Math.random()*40, 180 + Math.random()*100, '#c03010', 14, delay, -8, 8);
    makeFlame(layer, px, py, 40 + Math.random()*30, 140 + Math.random()*80,  '#f06020', 6,  delay+0.08, -5, 5);
    makeFlame(layer, px, py, 20 + Math.random()*14, 90 + Math.random()*50,   '#ffc030', 2,  delay+0.15, -3, 3);
  }
}

function spawnSmoke(rect, layer) {
  const bx = rect.left, by = rect.top, bw = rect.width, bh = rect.height;
  for (let i = 0; i < 18; i++) {
    const sx    = bx + bw * (0.15 + Math.random() * 0.7);
    const sy    = by + bh * 0.15 + Math.random() * bh * 0.3;
    const size  = 18 + Math.random() * 38;
    const delay = Math.random() * 2;
    const dx    = (Math.random() - 0.5) * 90;
    const dur   = 1.8 + Math.random() * 1.2;
    const s = document.createElement('div');
    s.style.cssText = `
      position:fixed;left:${sx - size/2}px;top:${sy - size/2}px;
      width:${size}px;height:${size}px;border-radius:50%;
      background:radial-gradient(circle,rgba(28,18,8,0.55),transparent 70%);
      --sdx:${dx}px;animation:smokeRise ${dur}s ease-out ${delay}s forwards;
      pointer-events:none;z-index:103;
    `;
    layer.appendChild(s);
  }
}

function spawnSparks(rect, layer) {
  const bx = rect.left, by = rect.top, bw = rect.width, bh = rect.height;
  for (let i = 0; i < 22; i++) {
    const sx    = bx + Math.random() * bw;
    const sy    = by + bh * 0.4 + Math.random() * bh * 0.6;
    const delay = 0.2 + Math.random() * 1.8;
    const spx   = (Math.random() - 0.5) * 120;
    const spy   = -(50 + Math.random() * 130);
    const dur   = 0.6 + Math.random() * 0.8;
    const size  = 2 + Math.random() * 3;
    const sp = document.createElement('div');
    sp.style.cssText = `
      position:fixed;left:${sx}px;top:${sy}px;
      width:${size}px;height:${size}px;border-radius:50%;
      background:#ffd060;box-shadow:0 0 4px 2px rgba(255,180,30,.7);
      --spx:${spx}px;--spy:${spy}px;
      animation:sparkFly ${dur}s ease-out ${delay}s forwards;
      pointer-events:none;z-index:104;
    `;
    layer.appendChild(sp);
  }
}

/* ─────────────────────────────────────────────
   TYPEWRITER FOR FINAL QUOTE
───────────────────────────────────────────── */
function typeQuote(el, text, i) {
  if (i === 0) {
    el.innerHTML = '';
    const cur = document.createElement('span');
    cur.id = 'cursor-blink';
    el.appendChild(cur);
  }
  if (i >= text.length) {
    setTimeout(() => {
      const c = document.getElementById('cursor-blink');
      if (c) { c.style.transition = 'opacity .6s ease'; c.style.opacity = '0'; setTimeout(() => c.remove(), 700); }
      el.style.animation = 'quoteglow 3.5s ease-in-out infinite';
    }, 1800);
    return;
  }
  const cur = document.getElementById('cursor-blink');
  const node = document.createTextNode(text[i]);
  el.insertBefore(node, cur);
  const baseDelay = text[i] === ' ' ? 60 : 48;
  const jitter = Math.random() * 70 - 18;
  setTimeout(() => typeQuote(el, text, i + 1), baseDelay + jitter);
}

/* ─────────────────────────────────────────────
   INTRO ANIMATION
───────────────────────────────────────────── */
function runIntro(){
  const titleBlock = document.getElementById('title-block');
  const proceedBtn = document.getElementById('proceed-btn');
  const bulbWraps  = document.querySelectorAll('.bulb-wrap');

  bulbWraps.forEach(bw => {
    bw.style.transform = 'translateY(-380px)';
    bw.style.opacity   = '0';
    bw.style.transition = 'none';
  });

  const delays = [80, 260, 420, 580, 740];
  bulbWraps.forEach((bw, i) => {
    setTimeout(() => {
      bw.style.transition = 'transform 0.9s cubic-bezier(0.22,1.4,0.36,1), opacity 0.25s ease';
      bw.style.opacity   = '1';
      bw.style.transform = 'translateY(0)';
    }, delays[i]);
  });

  setTimeout(() => {
    titleBlock.style.opacity   = '1';
    titleBlock.style.transform = 'translateY(0)';
    setTimeout(() => { proceedBtn.style.opacity = '1'; }, 950);
  }, 1050);
}

document.getElementById('proceed-btn').addEventListener('click',()=>{
 const intro=document.getElementById('intro-screen');
 intro.style.transition='opacity .8s ease';
 intro.style.opacity='0';
 setTimeout(()=>{
   intro.style.display='none';
   const game=document.getElementById('game-screen');
   game.style.display='flex';
   game.style.opacity='0';
   game.style.transition='opacity .7s ease';
   requestAnimationFrame(()=>requestAnimationFrame(()=>{
     game.style.opacity='1';
     setTimeout(()=>{
       const r=keyEl.getBoundingClientRect();
       origPos={left:r.left,top:r.top};
     },200);
   }));
 },750);
});

window.addEventListener('load',()=>setTimeout(runIntro,300));
